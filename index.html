<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0f0f12">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<title>Panel AkumaNet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{--bg:#0f0f12;--card:#17171c;--card2:#1f1f26;--line:#2a2a33;--txt:#f4f4f6;--mut:#9a9aa6;--acc:#e11d2e;--acc2:#ff4d5e;--accbg:rgba(225,29,46,.14);--ok:#22c55e;--warn:#f59e0b;--bad:#ff4d5e;--wa:#25d366;--okbg:rgba(34,197,94,.14);--warnbg:rgba(245,158,11,.15);--badbg:rgba(255,77,94,.15);--mutbg:rgba(154,154,166,.14);--hover:rgba(255,255,255,.035);--hdr:rgba(15,15,18,.9);--shadow:none;color-scheme:dark}
:root[data-theme=light]{--bg:#f4f4f6;--card:#ffffff;--card2:#f4f4f6;--line:#e4e4e9;--txt:#111114;--mut:#6b6b76;--acc2:#c81e2c;--accbg:rgba(225,29,46,.08);--ok:#15803d;--warn:#b45309;--bad:#c81e2c;--okbg:#dcfce7;--warnbg:#fef3c7;--badbg:#fee2e2;--mutbg:#ececf0;--hover:#f7f7f9;--hdr:rgba(255,255,255,.9);--shadow:0 1px 2px rgba(16,16,20,.05);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.layout{display:flex;min-height:100vh}
#side{width:228px;flex:none;background:var(--card);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 12px;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 20px}
.brand img{width:42px;height:42px;border-radius:50%;flex:none}
.brand b{display:block;font-size:16px;font-weight:700;letter-spacing:.2px}
.brand small{display:block;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.8px}
nav{display:flex;flex-direction:column;gap:2px}
nav button{display:flex;align-items:center;gap:11px;background:none;border:0;color:var(--mut);padding:9px 12px;border-radius:9px;font:inherit;font-weight:500;cursor:pointer;text-align:left;position:relative}
nav button i{font-size:19px;flex:none}
nav button:hover{background:var(--hover);color:var(--txt)}
nav button.act{background:var(--accbg);color:var(--acc2)}
nav button.act::before{content:'';position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--acc)}
nav button .tag{margin-left:auto}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding:14px 8px 0;font-size:12px;color:var(--mut)}
.side-foot b{display:block;color:var(--txt);font-size:13px}
.content{flex:1;min-width:0;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:20;background:var(--hdr);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 24px}
header.top h1{font-size:18px;font-weight:600;margin:0}
.hlogo{display:none;width:32px;height:32px;border-radius:50%}
.live{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px;white-space:nowrap;margin-left:auto}
.iconbtn{background:var(--card2);border:1px solid var(--line);color:var(--txt);width:36px;height:36px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;flex:none}
.iconbtn:hover{border-color:var(--acc)}
.mob{display:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut);opacity:.5;display:inline-block;flex:none}
.dot.on{background:var(--ok);opacity:1;box-shadow:0 0 0 3px var(--okbg)}
main{width:100%;max-width:1240px;margin:0 auto;padding:22px 24px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.kpi{position:relative;overflow:hidden}
.kpi .l{color:var(--mut);font-size:12px;font-weight:500;display:flex;align-items:center;gap:6px}
.kpi .l i{font-size:16px}
.kpi .v{font-size:30px;font-weight:700;margin-top:6px;letter-spacing:-.5px}
.kpi .s{font-size:12px;color:var(--mut)}
.kpi.bad .v{color:var(--bad)}.kpi.warn .v{color:var(--warn)}.kpi.ok .v{color:var(--ok)}
.kpi.acc{border-color:transparent;background:var(--acc);color:#fff}.kpi.acc .l,.kpi.acc .s{color:rgba(255,255,255,.85)}
.click{cursor:pointer;transition:border-color .15s,transform .15s}.click:hover{border-color:var(--acc)}
h2{font-size:15px;font-weight:600;margin:26px 0 12px;display:flex;align-items:center;gap:8px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
input,select,textarea{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font:inherit;min-width:0;width:auto;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accbg)}
textarea{width:100%;min-height:72px}
.btn{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:8px 13px;cursor:pointer;font:inherit;font-weight:500;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn i{font-size:16px}
.btn:hover{border-color:var(--acc)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}.btn.p:hover{filter:brightness(1.08)}
.btn.d{color:var(--bad)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#05391b}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn.full{width:100%;padding:11px;justify-content:center}
.tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.card .tablewrap,.modal .tablewrap{border:0;box-shadow:none;background:none}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
th{color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.6px;background:var(--card2);cursor:pointer;user-select:none;white-space:nowrap}
tbody tr:hover td,tr:hover td{background:var(--hover)}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap}
.t-ok{background:var(--okbg);color:var(--ok)}.t-warn{background:var(--warnbg);color:var(--warn)}.t-bad{background:var(--badbg);color:var(--bad)}.t-mut{background:var(--mutbg);color:var(--mut)}
.mut{color:var(--mut)}.r{text-align:right}.small{font-size:12px}
.acts{display:flex;gap:4px;flex-wrap:wrap}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(2px);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:6vh 12px;overflow:auto}
.modal{background:var(--card);border:1px solid var(--line);border-radius:16px;width:100%;max-width:540px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.modal h3{margin:0 0 14px;font-size:17px;font-weight:600}
.f{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:500;color:var(--mut)}
.f .full{grid-column:1/-1}
.dur{display:flex;gap:6px}.dur>*{flex:1;min-width:0}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.ucell{display:flex;align-items:center;justify-content:space-between;gap:6px}
.kbtn{background:none;border:0;color:var(--mut);width:32px;height:32px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.kbtn:hover,.kbtn.on{background:var(--hover);color:var(--txt)}
#kmenu{position:fixed;z-index:70;min-width:210px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 14px 36px rgba(0,0,0,.35);display:none}
#kmenu .kh{font-size:11px;font-weight:600;color:var(--mut);padding:6px 10px 6px;text-transform:uppercase;letter-spacing:.6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
#kmenu button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:var(--txt);padding:9px 10px;border-radius:8px;font:inherit;font-weight:500;cursor:pointer;text-align:left}
#kmenu button:hover{background:var(--hover)}
#kmenu button i{font-size:18px;color:var(--mut)}
#kmenu .warn,#kmenu .warn i{color:var(--warn)}#kmenu .bad,#kmenu .bad i{color:var(--bad)}#kmenu .ok,#kmenu .ok i{color:var(--ok)}
#kmenu hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
#nbg{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:16px}
#nbox{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.45);animation:npop .22s ease-out}
@keyframes npop{from{transform:translateY(12px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.nhead{padding:22px 22px 14px;text-align:center}
.nimg{background:#000;line-height:0}.nimg img{display:block;width:100%;max-height:52vh;object-fit:contain}
.nimg .ph{height:180px;display:flex;align-items:center;justify-content:center;color:#888;line-height:1.4}
.nimg + .nhead{padding-top:16px}
.imgpick{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.f .imgpick label.btn{flex-direction:row;color:var(--txt);font-size:12px;gap:6px}
.imgpick .th{width:110px;height:72px;border-radius:8px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--card2);color:var(--mut);font-size:11px}
.imgpick .th img{width:100%;height:100%;object-fit:cover}
.nicon{width:60px;height:60px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:10px}
.n-info .nicon{background:var(--accbg);color:var(--acc2)}.n-oferta .nicon{background:var(--okbg);color:var(--ok)}.n-urgente .nicon{background:var(--badbg);color:var(--bad)}
.nhead h3{margin:0;font-size:19px;font-weight:700}
.nbody{padding:0 22px 6px;color:var(--txt);white-space:pre-wrap;line-height:1.55;text-align:center;font-size:14.5px;max-height:45vh;overflow:auto}
.nfoot{display:flex;flex-direction:column;gap:8px;padding:18px 22px 22px}
.nfoot .btn{justify-content:center;padding:11px}
.ncount{font-size:11px;color:var(--mut);text-align:center;margin-top:-6px}
.bellwrap{position:relative}.bellwrap .tag{position:absolute;top:-4px;right:-4px;padding:0 5px;font-size:10px}
.nlist .item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.nlist .item:hover{border-color:var(--acc)}
.nlist .item.unseen{border-color:var(--acc);background:var(--accbg)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--txt);color:var(--bg);padding:10px 16px;border-radius:10px;display:none;z-index:99;max-width:90vw;font-weight:500}
#toast.err{background:var(--bad);color:#fff}
.loading{opacity:.5;pointer-events:none}
.chips button{background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:99px;padding:5px 12px;cursor:pointer;font:inherit;font-size:12px;font-weight:500}
.chips button.act{border-color:var(--acc);color:var(--acc2);background:var(--accbg)}
.days{display:flex;gap:5px;align-items:flex-end;height:130px;padding-top:14px}
.days div{flex:1;background:var(--acc);border-radius:5px 5px 0 0;min-height:3px;position:relative;opacity:.85}
.days div:first-child{opacity:1}
.days div span{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--mut)}
.dlab{display:flex;gap:5px;margin-top:4px}.dlab span{flex:1;text-align:center;font-size:10px;color:var(--mut)}
.prog{height:6px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:8px}.prog i{display:block;height:100%;background:var(--acc)}
.auth{max-width:400px;margin:7vh auto;padding:0 16px}
.auth .card{padding:26px}
.auth h2{margin:0 0 4px;font-size:20px}
.auth label{display:block;font-size:12px;font-weight:500;color:var(--mut);margin:14px 0 5px}
.auth input{width:100%}
.logo{text-align:center;margin-bottom:20px}
.logo img{width:96px;height:96px;border-radius:50%;box-shadow:0 0 0 4px var(--accbg)}
.logo b{display:block;font-size:20px;font-weight:700;margin-top:10px}
.logo small{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:1px}
.cred{background:var(--card2);border:1px dashed var(--acc);border-radius:10px;padding:12px;font-family:ui-monospace,monospace;font-size:13px;user-select:all;white-space:pre-wrap;word-break:break-all}
@media (max-width:900px){
  #side{position:fixed;top:auto;bottom:0;left:0;right:0;width:auto;height:auto;flex-direction:row;padding:4px 4px calc(4px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line)}
  .brand,.side-foot{display:none}
  nav{flex-direction:row;overflow-x:auto;width:100%;justify-content:space-around;gap:0;scrollbar-width:none}
  nav button{flex-direction:column;gap:2px;font-size:10px;padding:6px 8px;min-width:60px;align-items:center}
  nav button.act{background:none}
  nav button.act::before{left:20%;right:20%;top:0;bottom:auto;width:auto;height:3px;border-radius:0 0 3px 3px}
  nav button .tag{position:absolute;top:1px;right:6px;margin:0;padding:0 5px;font-size:9px}
  header.top{padding:10px 14px;gap:10px}
  header.top h1{font-size:16px}
  .hlogo,.mob{display:inline-flex}
  .live .lt{display:none}
  main{padding:14px 12px 90px}
  .hide-m{display:none}
  .f{grid-template-columns:1fr}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi .v{font-size:24px}
  #toast{bottom:84px}
  td,th{padding:8px 7px}
}
</style>
</head>

/* ============ utilidades ============ */
function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
function rawCall(fn,args){
  return new Promise(function(res,rej){
    if(window.google&&google.script&&google.script.run){
      var r=google.script.run.withSuccessHandler(res).withFailureHandler(rej);
      r[fn].apply(r,args);
    }else{
      var body={fn:fn==='api'?args[1]:fn,token:fn==='api'?args[0]:null,args:fn==='api'?args[2]:args};
      fetch(API_URL,{method:'POST',body:JSON.stringify(body)}).then(function(x){return x.json()}).then(function(j){j.ok?res(j.data):rej(new Error(j.error))}).catch(rej);
    }
  });
}
function call(fn){var args=[].slice.call(arguments,1);
  return rawCall('api',[S.token,fn,args]).catch(function(e){
    if(String(e&&e.message||e).indexOf('SESION')>=0){sessionExpired();throw new Error('Tu sesión venció, volvé a ingresar.')}
    throw e;
  });
}
function toast(m,err){var t=$('#toast');t.textContent=m;t.className=err?'err':'';t.style.display='block';clearTimeout(t._h);t._h=setTimeout(function(){t.style.display='none'},err?6000:2800)}
function fail(e){toast((e&&e.message)||String(e),true)}
function fdate(s){if(!s)return '-';var d=new Date(s);return d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'})}
function fdt(s){if(!s)return '-';var d=new Date(s);return d.toLocaleString('es-AR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'})}
function money(n){return '$ '+Number(n||0).toLocaleString('es-AR')}
function diasTag(d,status){
  if(status==='suspended')return '<span class="tag t-mut">Suspendido</span>';
  if(d<0)return '<span class="tag t-bad">Vencido '+(-d)+'d</span>';
  if(d===0)return '<span class="tag t-bad">Vence hoy</span>';
  if(d<=5)return '<span class="tag t-warn">'+d+' días</span>';
  return '<span class="tag t-ok">'+d+' días</span>';
}
function diasTxt(d){return d<0?'hace '+(-d)+' días':d===0?'hoy':d===1?'mañana':'en '+d+' días'}
function waNum(n){n=String(n||'').replace(/\D/g,'');if(!n)return '';if(n.length===10)n='549'+n;if(n.indexOf('54')===0&&n.charAt(2)!=='9'&&n.length===12)n='549'+n.slice(2);return n}
function fill(t,c){return t.replace(/\{usuario\}/g,c.username).replace(/\{fecha\}/g,fdate(c.exp)).replace(/\{dias\}/g,diasTxt(c.dias))}
function waLink(c,tpl){var n=waNum(c.wa);if(!n)return '';return 'https://wa.me/'+n+'?text='+encodeURIComponent(fill(tpl,c))}
function waText(num,txt){var n=waNum(num);return n?'https://wa.me/'+n+'?text='+encodeURIComponent(txt):'https://wa.me/?text='+encodeURIComponent(txt)}
function genPass(){var s='';for(var i=0;i<6;i++)s+=Math.floor(Math.random()*10);return s}
function isOnline(u){return S.online[u]}
function isAdmin(){return S.me&&S.me.role==='admin'}
function hasSubs(){return (S.resellers||[]).length>0||S.clients.some(function(c){return !c.own})}
function setTxt(id,t){var e=document.getElementById(id);if(e)e.textContent=t}

/* ============ modal ============ */
function openModal(html){$('#modal').innerHTML=html;$('#mbg').style.display='flex'}
function closeModal(){$('#mbg').style.display='none'}
$('#mbg').addEventListener('click',function(e){if(e.target.id==='mbg')closeModal()});
function busy(el,on){if(el)el.classList.toggle('loading',on)}
function ask(msg,ok,danger){return new Promise(function(res){
  $('#cmodal').innerHTML='<h3>Confirmar</h3><p>'+esc(msg)+'</p><div class="mfoot"><button class="btn" id="cno">Cancelar</button><button class="btn '+(danger?'d':'p')+'" id="cyes">'+esc(ok||'Confirmar')+'</button></div>';
  $('#cbg').style.display='flex';
  $('#cno').onclick=function(){$('#cbg').style.display='none';res(false)};
  $('#cyes').onclick=function(){$('#cbg').style.display='none';res(true)};
})}

/* ============ AUTENTICACIÓN ============ */
function logoBlock(){return '<div class="logo"><img src="'+LOGO+'" alt="AkumaNet"><b>AkumaNet</b><small>Panel de control</small></div>'}
function authScreen(html){stopWs();$('#app').innerHTML='<div class="auth">'+logoBlock()+'<div class="card">'+html+'</div></div>'}
function vLogin(msg){
  authScreen('<h2>Ingresar</h2><p class="mut small">'+esc(msg||'Entrá con tu clave API de Servex.')+'</p>'+
   '<form id="lf"><label>Clave API de Servex</label><input id="lk" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" placeholder="sx_..." required>'+
   '<div style="margin-top:16px"><button class="btn p full" id="lgo">Entrar</button></div></form>'+
   '<details style="margin-top:14px"><summary class="mut small" style="cursor:pointer">¿Dónde encuentro mi clave?</summary><ol class="mut small" style="padding-left:18px;margin:8px 0 0">'+
   '<li>Entrá a <b>servex.ws</b> con tu usuario de revendedor.</li><li>Tocá tu perfil (arriba a la derecha) → <b>Clave API</b>.</li><li>Si no tenés una, tocá <b>Generar nueva clave</b>.</li><li>Tocá el botón de copiar y pegala acá.</li></ol></details>');
  $('#lf').onsubmit=function(e){e.preventDefault();busy($('.auth'),true);var key=$('#lk').value.trim();
    rawCall('login',[key]).then(onLogged).catch(function(e){busy($('.auth'),false);
      if(String(e&&e.message||e).indexOf('VINCULAR')>=0)return vLinkCode(key);fail(e)})};
}
/** Primer ingreso de un revendedor nuevo (sin clientes): se vincula con el código que le da el super admin. */
function vLinkCode(key){
  authScreen('<h2>Vincular tu cuenta</h2><p class="mut small">Tu clave es válida, pero es la primera vez que entrás. Pedile a tu proveedor el <b>código de vinculación</b> de 6 números y escribilo acá. Se pide una sola vez.</p>'+
   '<form id="vf"><label>Código de vinculación</label><input id="vc" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="123456" required style="font-size:22px;letter-spacing:6px;text-align:center">'+
   '<div style="margin-top:16px"><button class="btn p full">Vincular y entrar</button></div></form>'+
   '<p style="text-align:center;margin:12px 0 0"><a href="#" class="mut small" onclick="vLogin();return false">Volver</a></p>');
  $('#vf').onsubmit=function(e){e.preventDefault();busy($('.auth'),true);
    rawCall('login',[key,$('#vc').value]).then(onLogged).catch(function(e){busy($('.auth'),false);fail(e)})};
}
function vProfile(){
  var me=S.me;
  authScreen('<h2>¡Bienvenido, '+esc(me.name)+'!</h2><p class="mut small">Antes de empezar dejanos tu correo: ahí te llega cada mañana la lista de clientes que tenés que avisar.</p>'+
   '<form id="pf"><label>Correo electrónico (para las notificaciones)</label><input id="pe" type="email" required value="'+esc(me.email)+'" placeholder="tucorreo@gmail.com">'+
   '<div style="margin-top:16px"><button class="btn p full">Guardar y entrar</button></div></form>'+
   '<p style="text-align:center;margin:12px 0 0"><a href="#" class="mut small" onclick="doLogout();return false">Salir</a></p>');
  $('#pf').onsubmit=function(e){e.preventDefault();busy($('.auth'),true);
    call('saveProfile',{email:$('#pe').value}).then(function(me){S.me=me;boot()}).catch(function(e){busy($('.auth'),false);fail(e)})};
}
function onLogged(r){S.token=r.token;S.me=r.me;store('pa_token',r.token);boot()}
function sessionExpired(){S.token=null;store('pa_token',null);vLogin('Tu sesión venció. Volvé a ingresar.')}
function doLogout(){var t=S.token;S.token=null;store('pa_token',null);rawCall('logout',[t]).catch(function(){});S.clients=[];S.online={};S.servers={};S.resellers=[];vLogin()}

function navTitle(v){var n=(isAdmin()?NAV_ADMIN:NAV_RES).filter(function(x){return x[0]===v})[0];return n?n[2]:''}
function shell(){

  $('#app').innerHTML='<div class="layout"><aside id="side"><div class="brand"><img src="'+LOGO+'" alt=""><div><b>AkumaNet</b><small>Panel de control</small></div></div>'+
   '<nav id="nav">'+nav+'</nav><div class="side-foot"><b>'+esc(S.me.name)+'</b>'+(isAdmin()?'Acceso total':'Revendedor')+
   '<div style="margin-top:10px"><button class="btn sm" onclick="doLogout()"><i class="ti ti-logout"></i>Salir</button></div></div></aside>'+
   '<div class="content"><header class="top"><img class="hlogo" src="'+LOGO+'" alt=""><h1 id="ptitle"></h1>'+
   '<span class="live"><span id="wsdot" class="dot"></span><span id="wstxt" class="lt">…</span></span>'+
   '<span class="bellwrap"><button class="iconbtn" onclick="bellClick()" aria-label="Notificaciones"><i class="ti ti-bell"></i></button><span id="bellN" class="tag t-bad" style="display:none"></span></span>'+
   '<button class="iconbtn" id="thbtn" onclick="toggleTheme()" aria-label="Cambiar tema"></button>'+
   '<button class="iconbtn mob" onclick="doLogout()" aria-label="Salir"><i class="ti ti-logout"></i></button></header><main id="main"></main></div></div>';
  $('#nav').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;go(b.dataset.v)});
  paintThemeBtn();
}
function go(v){S.view=v;render();window.scrollTo(0,0)}

/* ============ TEMA CLARO / OSCURO ============ */
function curTheme(){return document.documentElement.getAttribute('data-theme')==='light'?'light':'dark'}
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);var m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='light'?'#ffffff':'#0f0f12';paintThemeBtn()}
function paintThemeBtn(){var b=document.getElementById('thbtn');if(b)b.innerHTML='<i class="ti ti-'+(curTheme()==='light'?'moon':'sun')+'"></i>'}
function toggleTheme(){var t=curTheme()==='light'?'dark':'light';store('pa_theme',t);applyTheme(t)}
applyTheme(store('pa_theme')||(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'));
function goClients(scope,filter){S.scope=scope;S.filter=filter||'todos';S.reseller='';go('clientes')}
function render(){
  if(S.cfg&&!S.cfg.hasKey&&S.view!=='ajustes'){S.view='ajustes'}
  [].forEach.call(document.querySelectorAll('#nav button'),function(b){b.classList.toggle('act',b.dataset.v===S.view)});
  setTxt('ptitle',navTitle(S.view));
  var views={inicio:vInicio,clientes:vClientes,avisos:vAvisos,deudas:vDeudas,historial:vHistorial,ajustes:vAjustes};
  views.revendedores=vRevendedores;
  if(isAdmin()){views.control=vControl;views.reporte=vReporte;views.accesos=vAccesos;views.notificaciones=vNotificaciones}
  (views[S.view]||vInicio)();
}
function boot(){
  if(!S.token)return vLogin();
  if(S.me&&S.me.needsProfile)return vProfile();
  $('#app').innerHTML='<div class="auth">'+logoBlock()+'<p class="mut" style="text-align:center">Cargando…</p></div>';
  call('getConfig').then(function(cfg){
    S.cfg=cfg;S.me=cfg.me;
    if(S.me.needsProfile)return vProfile();
    shell();S.view='inicio';render();startWs();loadNotices(true);
    if(cfg.hasKey){loadClients();loadDebts();loadResellers()}
  }).catch(function(e){if(S.token)vLogin(e.message||String(e))});
}

/* ============ INICIO ============ */

      '<div class="card kpi click" onclick="goClients(\'mios\')"><div class="l"><i class="ti ti-users"></i>Mis clientes</div><div class="v">'+s.totalClients+'</div><div class="s" id="kMineOn"></div></div>'+
      (A?'<div class="card kpi click" onclick="goClients(\'rev\')"><div class="l"><i class="ti ti-building-store"></i>Clientes de revendedores</div><div class="v" id="kRev">…</div><div class="s" id="kRevSub"></div></div>'+

/* ============ KPIs en vivo ============ */
function refreshKpis(){
  var on=S.online,tot=Object.keys(on).length,mine=0,rev=0;
  S.clients.forEach(function(c){if(on[c.username]){if(c.own)mine++;else rev++}});
  setTxt('kOnline',tot);
  setTxt('kOnlineSub',(isAdmin()||hasSubs())?'míos '+mine+' · revendedores '+rev:'de '+S.clients.length+' clientes');
  setTxt('kMineOn',mine+' en línea');
  if(S.clients.length&&isAdmin()){
    var r=S.clients.filter(function(c){return !c.own});
    setTxt('kRev',r.length);
    setTxt('kRevSub',rev+' en línea · '+r.filter(function(c){return c.dias<0}).length+' vencidos');
    var n=getAlerts().length;setTxt('kAlert',n);
    var b=document.getElementById('navAlert');if(b){b.textContent=n;b.style.display=n?'inline-block':'none'}
  }
}

/* ============ CONTROL (alertas, super admin) ============ */
function getAlerts(){
  var st=S.cfg.settings,mx=Number(st.maxConexRev)||1,md=Number(st.maxDiasRev)||35,out=[];
  S.clients.forEach(function(c){
    var o=isOnline(c.username);
    if(!c.own&&c.limit>mx)out.push({sev:'warn',tipo:'Cliente de revendedor con más conexiones de lo permitido',c:c,det:c.limit+' conexiones (máx. '+mx+')'});
    if(!c.own&&c.type==='user'&&c.dias>md)out.push({sev:'warn',tipo:'Vencimiento demasiado largo (más de '+md+' días)',c:c,det:'vence en '+c.dias+' días ('+fdate(c.exp)+')'});
    if(c.type==='test'&&c.status!=='suspended'&&(new Date(c.exp)-Date.now())>26*36e5)out.push({sev:'warn',tipo:'Prueba con más de 1 día',c:c,det:'vence '+fdt(c.exp)});
    if(o&&o.connection_count>c.limit)out.push({sev:'bad',tipo:'Usando más conexiones que su límite',c:c,det:o.connection_count+' conectadas / límite '+c.limit});
    if(o&&(c.dias<0||c.status==='suspended'))out.push({sev:'bad',tipo:'Conectado estando vencido o suspendido',c:c,det:c.status==='suspended'?'suspendido':'vencido hace '+(-c.dias)+' días'});
  });
  var seen={};S.clients.forEach(function(c){(seen[c.username]=seen[c.username]||[]).push(c)});
  Object.keys(seen).forEach(function(u){if(seen[u].length>1)seen[u].forEach(function(c){out.push({sev:'warn',del:true,tipo:'Usuario repetido (ocupa cupo dos veces)',c:c,det:'ID '+c.id+' · vence '+fdate(c.exp)+' · '+c.limit+' conex.'})})});
  (S.resellers||[]).forEach(function(r){
    if(r.max_users&&r._used>r.max_users)out.push({sev:'bad',tipo:'Revendedor pasado de su cupo',r:r,det:r._used+' / '+r.max_users+' usuarios'});
    if(r.account_type!=='credit'&&r._dias>=0&&r._dias<=3)out.push({sev:'warn',tipo:'Revendedor vence en 3 días o menos',r:r,det:'vence '+fdate(r.expiration_date)});
  });
  return out;
}
function alertRows(list){
  return list.map(function(a){
    if(a.r)return '<tr><td><b>'+esc(a.r.name)+'</b><div class="mut small">revendedor</div></td><td>'+esc(a.det)+'</td><td class="acts"><button class="btn sm p" onclick="closeModal();go(\'revendedores\')">Ver</button></td></tr>';
    var c=a.c,o=isOnline(c.username);
    return '<tr><td><span class="dot '+(o?'on':'')+'"></span> <b>'+esc(c.username)+'</b><div class="mut small">'+(c.own?'mío':'de '+esc(c.reseller||'?'))+'</div></td><td>'+esc(a.det)+'</td>'+
     '<td class="acts"><button class="btn sm" onclick="clientDlg('+c.id+')">Editar</button><button class="btn sm" onclick="infoDlg('+c.id+')">Datos</button>'+
     (a.del?'<button class="btn sm d" onclick="delClient('+c.id+')">Eliminar</button>':c.status!=='suspended'?'<button class="btn sm d" onclick="suspClient('+c.id+')">Suspender</button>':'')+'</td></tr>';
  }).join('');
}
function vControl(){
  var m=$('#main');
  if(!S.clients.length){m.innerHTML='<div class="mut">Cargando clientes…</div>';loadClients().then(function(){if(S.view==='control')vControl()});return}
  var al=getAlerts(),grp={};
  al.forEach(function(a){(grp[a.tipo]=grp[a.tipo]||{sev:a.sev,items:[]}).items.push(a)});
  var keys=Object.keys(grp).sort(function(a,b){return (grp[a].sev==='bad'?0:1)-(grp[b].sev==='bad'?0:1)});
  m.innerHTML='<p class="mut">Revisión automática de tus clientes y los de tus revendedores. Los límites se cambian en Ajustes. Las conexiones se toman en vivo; tocá Actualizar para recalcular.</p>'+
   '<div class="bar"><button class="btn" onclick="Promise.all([loadClients(),loadResellers()]).then(function(){vControl();toast(\'Actualizado\')})">↻ Actualizar</button></div>'+
   (keys.map(function(k){var g=grp[k];
     return '<h2><span class="tag '+(g.sev==='bad'?'t-bad':'t-warn')+'">'+g.items.length+'</span> '+esc(k)+'</h2><div class="card tablewrap"><table>'+alertRows(g.items)+'</table></div>';
   }).join('')||'<div class="card">Todo en orden ✅ No hay alertas.</div>');
}
function loadResellers(){return call('listResellers').then(function(l){S.resellers=l;refreshKpis();return l}).catch(function(e){console.warn(e)})}

/* ============ REPORTE POR REVENDEDOR (super admin) ============ */
function resellerStats(){
  var map={};
  function row(name){return map[name]=map[name]||{name:name,r:null,total:0,on:0,activos:0,vencidos:0,pronto:0,pruebas:0,susp:0,alertas:0,acc:null}}
  (S.resellers||[]).forEach(function(r){row(r.name).r=r});
  S.clients.forEach(function(c){if(c.own)return;var x=row(c.reseller||'?');x.total++;
    if(isOnline(c.username))x.on++;
    if(c.status==='suspended')x.susp++;else if(c.dias<0)x.vencidos++;else x.activos++;
    if(c.dias>=0&&c.dias<=7)x.pronto++;if(c.type==='test')x.pruebas++});
  getAlerts().forEach(function(a){var n=a.r?a.r.name:(a.c&&!a.c.own?a.c.reseller:null);if(n&&map[n])map[n].alertas++});
  (S.access||[]).forEach(function(u){if(!u.resellerId)return;(S.resellers||[]).forEach(function(r){if(r.id===u.resellerId&&map[r.name])map[r.name].acc=u})});
  return Object.keys(map).map(function(k){return map[k]}).sort(function(a,b){return b.total-a.total});
}
function vReporte(){
  var m=$('#main');m.innerHTML='<div class="mut">Cargando…</div>';
  Promise.all([S.clients.length?S.clients:loadClients(),S.resellers.length?S.resellers:loadResellers(),call('listAccess').then(function(a){S.access=a})]).then(function(){
    var rows=resellerStats();
    m.innerHTML='<p class="mut">Resumen de cada revendedor (incluye sub-revendedores). Tocá una fila para ver sus clientes y alertas.</p>'+
     '<div class="tablewrap"><table><tr><th>Revendedor</th><th>Clientes</th><th>En línea</th><th class="hide-m">Activos</th><th>Vencidos</th><th class="hide-m">Vencen 7d</th><th class="hide-m">Pruebas</th><th>Alertas</th><th class="hide-m">Cupo</th><th class="hide-m">Cuenta vence</th><th class="hide-m">Panel</th></tr>'+
     rows.map(function(x,i){var r=x.r;
       return '<tr class="click" onclick="repDetail('+i+')"><td><b>'+esc(x.name)+'</b>'+(r?'':'<div class="mut small">sub-revendedor</div>')+'</td><td>'+x.total+'</td><td style="color:var(--ok)">'+x.on+'</td><td class="hide-m">'+x.activos+'</td>'+
        '<td'+(x.vencidos?' style="color:var(--bad)"':'')+'>'+x.vencidos+'</td><td class="hide-m">'+x.pronto+'</td><td class="hide-m">'+x.pruebas+'</td>'+
        '<td>'+(x.alertas?'<span class="tag t-bad">'+x.alertas+'</span>':'<span class="mut">0</span>')+'</td>'+
        '<td class="hide-m">'+(r?r._used+'/'+r.max_users:'-')+'</td><td class="hide-m">'+(r?fdate(r.expiration_date):'-')+'</td>'+
        '<td class="hide-m">'+(x.acc?(x.acc.active?'<span class="tag t-ok">activo</span>':'<span class="tag t-mut">off</span>')+'<div class="mut small">'+(x.acc.lastLogin?'entró '+fdt(x.acc.lastLogin):'nunca entró')+'</div>':'<span class="mut small">sin acceso</span>')+'</td></tr>';
     }).join('')+'</table></div>';
    S._rep=rows;
  }).catch(function(e){m.innerHTML='<div class="card">Error: '+esc(e.message||e)+'</div>'});
}
function repDetail(i){
  var x=S._rep[i],list=S.clients.filter(function(c){return !c.own&&c.reseller===x.name}).sort(function(a,b){return a.dias-b.dias});
  var al=getAlerts().filter(function(a){return a.r?a.r.name===x.name:(a.c&&!a.c.own&&a.c.reseller===x.name)});
  openModal('<h3>'+esc(x.name)+'</h3><div class="grid" style="grid-template-columns:repeat(3,1fr)"><div class="card kpi"><div class="l">Clientes</div><div class="v">'+x.total+'</div></div><div class="card kpi ok"><div class="l">En línea</div><div class="v">'+x.on+'</div></div><div class="card kpi bad"><div class="l">Vencidos</div><div class="v">'+x.vencidos+'</div></div></div>'+
   (al.length?'<h2>Alertas</h2><div class="tablewrap"><table>'+alertRows(al)+'</table></div>':'')+
   '<h2>Clientes</h2><div class="tablewrap" style="max-height:45vh;overflow:auto"><table>'+list.map(function(c){var o=isOnline(c.username);
     return '<tr><td><span class="dot '+(o?'on':'')+'"></span> '+esc(c.username)+'</td><td>'+diasTag(c.dias,c.status)+'</td><td class="mut small">'+c.limit+' conex.</td><td><button class="btn sm" onclick="infoDlg('+c.id+')">Datos</button></td></tr>'}).join('')+'</table></div>'+
   '<div class="mfoot"><button class="btn" onclick="closeModal()">Cerrar</button><button class="btn p" onclick="closeModal();S.scope=\'rev\';S.reseller=S._rep['+i+'].name;S.filter=\'todos\';go(\'clientes\')">Ver en Clientes</button></div>');
}

/* ============ CLIENTES ============ */
function loadClients(){
  return call('listClients').then(function(list){S.clients=list;wsFilter();refreshKpis();if(S.view==='clientes')drawClients();return list}).catch(fail);
}
function resellerNames(){var n={};S.clients.forEach(function(c){if(!c.own&&c.reseller)n[c.reseller]=(n[c.reseller]||0)+1});return Object.keys(n).sort().map(function(k){return [k,n[k]]})}
function vClientes(){
  var A=isAdmin()||hasSubs();if(!A)S.scope='mios';
  $('#main').innerHTML=
    '<div class="bar"><input id="q" placeholder="Buscar usuario, WhatsApp, nota…" style="flex:1;min-width:160px" value="'+esc(S.search)+'">'+
    '<button class="btn p" onclick="clientDlg()">+ Nuevo</button><button class="btn" onclick="clientDlg(null,true)">+ Prueba</button><button class="btn" onclick="loadClients().then(function(){toast(\'Actualizado\')})">↻</button></div>'+
    (A?'<div class="bar chips" id="scopes">'+[['mios','Míos'],['rev','De revendedores'],['todos','Todos']].map(function(f){return '<button data-s="'+f[0]+'" class="'+(S.scope===f[0]?'act':'')+'">'+f[1]+'</button>'}).join('')+
    '<select id="rsel" style="display:'+(S.scope==='mios'?'none':'inline-block')+'"><option value="">Todos los revendedores</option>'+resellerNames().map(function(r){return '<option value="'+esc(r[0])+'" '+(S.reseller===r[0]?'selected':'')+'>'+esc(r[0])+' ('+r[1]+')</option>'}).join('')+'</select></div>':'')+
    '<div class="bar chips" id="chips">'+
    [['todos','Todos'],['online','En línea'],['offline','Desconectados'],['hoy','Vencen hoy'],['pronto','≤5 días'],['vencidos','Vencidos'],['suspendidos','Suspendidos'],['pruebas','Pruebas'],['sinwa','Sin WhatsApp']]
      .map(function(f){return '<button data-f="'+f[0]+'" class="'+(S.filter===f[0]?'act':'')+'">'+f[1]+'</button>'}).join('')+
    '</div><div class="mut" id="cnt" style="margin-bottom:6px"></div><div class="tablewrap"><table id="ctable"></table></div>';
  $('#q').addEventListener('input',function(e){S.search=e.target.value;drawClients()});
  $('#chips').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;S.filter=b.dataset.f;[].forEach.call(this.children,function(x){x.classList.toggle('act',x===b)});drawClients()});
  if(A){
    $('#scopes').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;S.scope=b.dataset.s;if(S.scope==='mios')S.reseller='';vClientes()});
    $('#rsel').onchange=function(){S.reseller=this.value;drawClients()};
  }
  if(S.clients.length)drawClients();else{$('#ctable').innerHTML='<tr><td class="mut">Cargando clientes…</td></tr>';loadClients().then(function(){if(S.view==='clientes')vClientes()})}
}
function filteredClients(){
  var q=S.search.toLowerCase().trim();
  return S.clients.filter(function(c){
    if(S.scope==='mios'&&!c.own)return false;
    if(S.scope==='rev'&&c.own)return false;
    if(S.reseller&&c.reseller!==S.reseller)return false;
    var on=!!isOnline(c.username);
    switch(S.filter){
      case 'online':if(!on)return false;break;case 'offline':if(on)return false;break;
      case 'hoy':if(c.dias!==0)return false;break;case 'pronto':if(c.dias<0||c.dias>5)return false;break;
      case 'vencidos':if(c.dias>=0)return false;break;case 'suspendidos':if(c.status!=='suspended')return false;break;
      case 'pruebas':if(c.type!=='test')return false;break;case 'sinwa':if(c.wa)return false;break;
    }
    if(q&&(c.username+' '+c.wa+' '+c.nota+' '+c.tag+' '+c.category+' '+(c.reseller||'')).toLowerCase().indexOf(q)<0)return false;
    return true;
  }).sort(function(a,b){
    if(S.sort==='user')return a.username.localeCompare(b.username);
    if(S.sort==='online')return (isOnline(b.username)?1:0)-(isOnline(a.username)?1:0)||a.dias-b.dias;
    return a.dias-b.dias;
  });
}
function drawClients(){
  var t=$('#ctable');if(!t)return;
  var list=filteredClients(),showR=(isAdmin()||hasSubs())&&S.scope!=='mios';
  var base=S.clients.filter(function(c){return S.scope==='todos'||(S.scope==='mios'?c.own:!c.own)});
  var onN=list.filter(function(c){return isOnline(c.username)}).length;
  $('#cnt').textContent=list.length+' de '+base.length+' clientes · '+onN+' en línea';
  var mx=Number(S.cfg.settings.maxConexRev)||1;
  t.innerHTML='<tr><th onclick="S.sort=\'online\';drawClients()">●</th><th onclick="S.sort=\'user\';drawClients()">Usuario</th>'+(showR?'<th>Revendedor</th>':'')+'<th onclick="S.sort=\'dias\';drawClients()">Vence</th><th class="hide-m">Conex.</th><th class="hide-m">Método</th><th class="hide-m">WhatsApp</th><th>Acciones</th></tr>'+
  list.map(function(c){
    var o=isOnline(c.username);
    var l=waLink(c,c.dias<0?S.cfg.settings.plantillaVencido:S.cfg.settings.plantillaAviso);
    var bad=(o&&o.connection_count>c.limit)||(isAdmin()&&!c.own&&c.limit>mx);

/* ============ días <-> calendario ============ */
function pad2(n){return (n<10?'0':'')+n}
function isoDate(t){var d=new Date(t);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function durField(daysId,dateId,name){
  return '<span class="dur"><input id="'+daysId+'" '+(name?'name="'+name+'" ':'')+'type="number" min="1" value="30" title="Días">'+
   '<input type="date" id="'+dateId+'" title="Vence el"></span>'+
   '<span class="chips" style="display:flex;gap:4px;flex-wrap:wrap;margin-top:6px">'+[7,15,30,60,90].map(function(d){return '<button type="button" onclick="setDays(\''+daysId+'\','+d+')">'+d+' días</button>'}).join('')+'</span>';
}
function linkDays(daysId,dateId,base){
  var di=$('#'+daysId),dt=$('#'+dateId);if(!di||!dt)return;
  var b0=new Date(base);b0=new Date(b0.getFullYear(),b0.getMonth(),b0.getDate());
  dt.min=isoDate(b0.getTime()+864e5);
  di.oninput=function(){var n=Number(di.value)||0;if(n>0)dt.value=isoDate(b0.getTime()+n*864e5)};
  dt.onchange=function(){if(!dt.value)return;var p=dt.value.split('-');var t=new Date(+p[0],p[1]-1,+p[2]);di.value=Math.max(1,Math.round((t-b0)/864e5))};
  di.oninput();
}
function setDays(id,n){var e=$('#'+id);if(!e)return;e.value=n;if(e.oninput)e.oninput()}
/* ============ MENÚ DE ACCIONES (3 puntos) ============ */
var KBTN=null;
function closeKMenu(){var m=$('#kmenu');if(m)m.style.display='none';if(KBTN){KBTN.classList.remove('on');KBTN=null}}
function openKMenu(ev,title,items){
  ev.stopPropagation();ev.preventDefault();
  var btn=ev.currentTarget,m=$('#kmenu');
  if(KBTN===btn&&m.style.display==='block'){closeKMenu();return}
  closeKMenu();KBTN=btn;btn.classList.add('on');
  m._items=items;
  m.innerHTML='<div class="kh">'+esc(title)+'</div>'+items.map(function(it,i){
    return it==='-'?'<hr>':'<button type="button" role="menuitem" class="'+(it.cls||'')+'" data-i="'+i+'"><i class="ti ti-'+it.icon+'"></i>'+esc(it.label)+'</button>'}).join('');
  m.style.display='block';
  var r=btn.getBoundingClientRect(),w=m.offsetWidth,h=m.offsetHeight;
  var left=Math.min(window.innerWidth-w-8,r.right-w);if(left<8)left=8;
  var top=r.bottom+4;if(top+h>window.innerHeight-8)top=Math.max(8,r.top-h-4);
  m.style.left=left+'px';m.style.top=top+'px';
}
document.addEventListener('click',function(e){
  var m=$('#kmenu');if(!m||m.style.display!=='block')return;
  var b=e.target.closest('#kmenu button');
  if(b){var it=m._items[+b.dataset.i];closeKMenu();if(it&&it.fn)it.fn();return}
  if(!e.target.closest('#kmenu'))closeKMenu();
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeKMenu()});
window.addEventListener('scroll',function(e){if(!e.target.closest||!e.target.closest('#kmenu'))closeKMenu()},true);
window.addEventListener('resize',closeKMenu);

function loadImg(id){if(!id)return Promise.resolve('');if(S.imgCache[id])return Promise.resolve(S.imgCache[id]);return call('getImage',id).then(function(d){S.imgCache[id]=d||'';return d||''})}
/** Achica la imagen en el navegador (máx. 900 px de ancho) para que pese poco. */
function shrinkImage(file){return new Promise(function(res,rej){
  if(!file||!/^image\//.test(file.type))return rej(new Error('Elegí un archivo de imagen.'));
  var fr=new FileReader();fr.onerror=function(){rej(new Error('No se pudo leer la imagen.'))};
  fr.onload=function(){var im=new Image();im.onerror=function(){rej(new Error('No se pudo abrir la imagen.'))};
    im.onload=function(){var w=im.width,h=im.height,s=Math.min(1,900/w,1400/h);var cv=document.createElement('canvas');cv.width=Math.round(w*s);cv.height=Math.round(h*s);
      var g=cv.getContext('2d');g.fillStyle='#000';g.fillRect(0,0,cv.width,cv.height);g.drawImage(im,0,0,cv.width,cv.height);
      var q=0.82,out=cv.toDataURL('image/jpeg',q);while(out.length>550000&&q>0.4){q-=0.12;out=cv.toDataURL('image/jpeg',q)}
      if(out.length>590000)return rej(new Error('La imagen es muy pesada. Probá con una más chica.'));res(out)};
    im.src=fr.result};
  fr.readAsDataURL(file)})}

/* ============ TIEMPO REAL (WebSocket) ============ */
var WS=null,wsRetry=0,wsStop=false;
function setWs(on,txt){var d=$('#wsdot');if(d)d.className='dot'+(on?' on':'');setTxt('wstxt',txt)}
function stopWs(){wsStop=true;try{if(WS)WS.close()}catch(e){}WS=null}
function startWs(){
  if(!S.cfg||!S.cfg.hasKey)return;
  wsStop=false;
  call('getWsToken').then(function(t){
    try{if(WS)WS.close()}catch(e){}
    WS=new WebSocket('wss://front.servex.ws/ws/user-status?token='+encodeURIComponent(t.token));
    WS.onopen=function(){wsRetry=0;setWs(true,'en vivo');wsFilter()};
    WS.onmessage=function(e){var d;try{d=JSON.parse(e.data)}catch(x){return}if(d&&d.onlineUsers){S.servers[d.serverId||'0']=d.onlineUsers;recompute()}};
    WS.onclose=function(){if(wsStop)return;setWs(false,'reconectando…');setTimeout(startWs,Math.min(30000,3000*(++wsRetry)))};
    WS.onerror=function(){setWs(false,'sin conexión en vivo')};
  }).catch(function(e){setWs(false,'sin tiempo real');console.warn(e)});
}
function wsFilter(){if(WS&&WS.readyState===1&&S.clients.length)WS.send(JSON.stringify({type:'update_filter',usernames:S.clients.map(function(c){return c.username})}))}
var rcT=null;
function recompute(){clearTimeout(rcT);rcT=setTimeout(function(){
  var on={};Object.keys(S.servers).forEach(function(k){(S.servers[k]||[]).forEach(function(u){var p=on[u.username];
    if(p){on[u.username]={username:u.username,connection_method:p.connection_method,connected_at:p.connected_at<u.connected_at?p.connected_at:u.connected_at,connection_count:p.connection_count+u.connection_count}}else on[u.username]=u})});
  if(!isAdmin()){var mine={};S.clients.forEach(function(c){if(on[c.username])mine[c.username]=on[c.username]});on=mine}
  S.online=on;
  refreshKpis();
  setWs(true,'en vivo · '+Object.keys(on).length+' en línea');
  if(S.view==='clientes')drawClients();
},400)}
